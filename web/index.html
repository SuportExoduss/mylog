<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyLog — Painel</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚚</text></svg>">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>

<!-- ------------------------------------------------------------- login -->
<div id="tela-login" class="login oculto">
  <form class="login-caixa" id="form-login">
    <h1 class="login-marca">My<span>Log</span></h1>
    <p class="login-sub">Painel de supervisao de frota</p>

    <div id="login-aviso" class="aviso aviso--erro oculto"></div>

    <div class="campo">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="login-senha">Senha</label>
      <input id="login-senha" type="password" autocomplete="current-password" required>
    </div>
    <button class="botao botao--largo" type="submit" id="login-botao">Entrar</button>
  </form>
</div>

<!-- --------------------------------------------------------------- app -->
<div id="tela-app" class="app oculto">
  <aside class="lateral">
    <div class="lateral-marca">My<span>Log</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="lateral-rodape">
      <div class="perfil-nome" id="perfil-nome"></div>
      <div class="perfil-papel" id="perfil-papel"></div>
      <button class="botao botao--suave botao--mini" id="botao-sair" style="margin-top:10px">Sair</button>
    </div>
  </aside>

  <main class="conteudo" id="conteudo"></main>
</div>

<div id="area-modal"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
