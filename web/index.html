<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyLog — Painel</title>
  <meta name="description" content="Plataforma de checklist, tickets e manutencao preventiva de frota.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#35539f">

  <!-- Favicon: o mesmo simbolo da marca, em SVG, servido inline.
       Sem arquivo externo e sem emoji — a identidade vale ate na aba. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2.6' y='2.6' width='26.8' height='26.8' rx='7.5' fill='none' stroke='%2335539f' stroke-width='2.4'/%3E%3Cpath d='M9.8 15.6 L14 19.8 L22.4 11' fill='none' stroke='%2335539f' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M10.2 24.2 H21.8' stroke='%2335539f' stroke-width='2.4' stroke-linecap='round' opacity='.45'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="/css/estilo.css">

  <!-- Aplica o tema guardado antes da primeira pintura, para nao piscar
       branco em quem escolheu o escuro. -->
  <script>
    try {
      var t = localStorage.getItem('mylog.tema')
      if (t) document.documentElement.dataset.tema = t
    } catch (e) { /* sem storage: segue a preferencia do sistema */ }
  </script>
</head>
<body>

<!-- ------------------------------------------------------------- login -->
<div id="tela-login" class="login oculto">
  <form class="login-caixa" id="form-login">
    <div class="login-topo">
      <div id="login-marca"></div>
      <p class="login-sub">Painel de supervisao de frota</p>
    </div>

    <div id="login-aviso" class="aviso aviso--erro oculto" role="alert"></div>

    <div class="campo">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="login-senha">Senha</label>
      <input id="login-senha" type="password" autocomplete="current-password" required>
    </div>
    <button class="botao botao--largo esp-t-4" type="submit" id="login-botao">Entrar</button>
  </form>
</div>

<!-- --------------------------------------------------------------- app -->
<div id="tela-app" class="app oculto">
  <aside class="lateral">
    <div class="lateral-marca" id="app-marca"></div>
    <nav class="nav" id="nav" aria-label="Secoes do painel"></nav>

    <div class="lateral-rodape">
      <div>
        <div class="perfil-nome" id="perfil-nome"></div>
        <div class="perfil-papel" id="perfil-papel"></div>
      </div>
      <div class="lateral-acoes">
        <button class="botao botao--suave botao--mini" id="botao-tema"
                title="Alternar tema claro e escuro">Tema</button>
        <button class="botao botao--suave botao--mini" id="botao-sair">Sair</button>
      </div>
    </div>
  </aside>

  <main class="conteudo" id="conteudo"></main>
</div>

<div id="area-modal"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
